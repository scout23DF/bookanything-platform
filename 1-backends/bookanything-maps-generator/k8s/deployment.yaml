apiVersion: apps/v1
kind: Deployment
metadata:
  name: bookanything-maps-generator
  namespace: drr-tnt-swfabrik-europe-dev
  labels:
    app.kubernetes.io/name: bookanything-maps-generator
    app.kubernetes.io/component: maps-generator
    darueira.io/tenant: swfabrik-europe
    darueira.io/tier: tenant-workload
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: bookanything-maps-generator
      darueira.io/tenant: swfabrik-europe
  template:
    metadata:
      labels:
        app.kubernetes.io/name: bookanything-maps-generator
        app.kubernetes.io/component: maps-generator
        darueira.io/tenant: swfabrik-europe
        darueira.io/tier: tenant-workload
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: maps-generator
        image: 127.0.0.1:32082/swfabrik-europe/bookanything-maps-generator:latest
        imagePullPolicy: Always
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: false
          seccompProfile:
            type: RuntimeDefault
        ports:
        - containerPort: 8000
          name: http
        env:
        - name: SERVER_PORT
          value: "8000"
        - name: TEMPORAL_HOST_PORT
          value: "temporal-frontend.drr-corpshared-plat.svc.cluster.local:7233"
        - name: TEMPORAL_NAMESPACE
          value: "corporate-core"
        - name: TEMPORAL_TASK_QUEUE
          value: "MAPS_GENERATOR_TASK_QUEUE"
        - name: TEMPORAL_WORKER_ENABLED
          value: "true"
        - name: MINIO_ENDPOINT
          value: "http://tenant-minio.drr-tnt-swfabrik-europe-dev.svc.cluster.local:9000"
        - name: MINIO_ACCESS_KEY
          value: "admin@dexterity.org.de"
        - name: MINIO_SECRET_KEY
          value: "admin_1a88a1"
        - name: MINIO_BUCKET_IMAGES
          value: "bookanything-images"
        resources:
          requests:
            cpu: 200m
            memory: 512Mi
          limits:
            cpu: 2000m
            memory: 3Gi
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8000
          initialDelaySeconds: 15
          periodSeconds: 15
          timeoutSeconds: 5
        readinessProbe:
          httpGet:
            path: /healthz
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: bookanything-maps-generator
  namespace: drr-tnt-swfabrik-europe-dev
  labels:
    app.kubernetes.io/name: bookanything-maps-generator
    darueira.io/tenant: swfabrik-europe
spec:
  type: ClusterIP
  ports:
  - port: 8000
    targetPort: 8000
    name: http
  selector:
    app.kubernetes.io/name: bookanything-maps-generator
    darueira.io/tenant: swfabrik-europe
