# ==============================================================================
# Spring Profile: darueira-k8s
# Runs in-cluster inside MicroK8s using Kubernetes DNS service names
# ==============================================================================
server:
  port: ${SERVER_PORT:8060}

spring:
  docker:
    compose:
      enabled: false

  datasource:
    driver-class-name: org.postgresql.Driver
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://tenant-postgres.drr-tnt-swfabrik-europe-dev.svc.cluster.local:5432/DBBookAnythingPlatform}
    username: ${SPRING_DATASOURCE_USERNAME:dbabookanythingapps01}
    password: ${SPRING_DATASOURCE_PASSWORD:1a88a1}

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://tenant-keycloak.drr-tnt-swfabrik-europe-dev.svc.cluster.local:8080/realms/dexterity-apps-01/protocol/openid-connect/certs}
      resource-server:
        jwt:
          jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://tenant-keycloak.drr-tnt-swfabrik-europe-dev.svc.cluster.local:8080/realms/dexterity-apps-01/protocol/openid-connect/certs}
      client:
        provider:
          oidc:
            issuer-uri: ${KEYCLOAK_ISSUER_URI:http://tenant-keycloak.drr-tnt-swfabrik-europe-dev.svc.cluster.local:8080/realms/dexterity-apps-01}
        registration:
          oidc:
            client-id: ${KEYCLOAK_CLIENT_ID:web_app}
            client-secret: ${KEYCLOAK_CLIENT_SECRET:web_app}
            scope: openid,profile,email

  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:message-broker-kafka.drr-corpshared-plat.svc.cluster.local:9092}

  elasticsearch:
    uris: ${SPRING_ELASTICSEARCH_URIS:http://opensearch.drr-corpshared-obs.svc.cluster.local:9200}

  ai:
    model:
      chat: google-genai
    google:
      genai:
        api-key: ${GEMINI_API_KEY:AIzaSyAJ85F9hPExyK48KSsa_AJu8jAXz87f8f4}
        chat:
          model: gemini-2.5-flash-lite
          temperature: 0.2
          top-p: 0.8
          options:
            model: gemini-2.5-flash-lite
            temperature: 0.2
            top-p: 0.8

management:
  health:
    elasticsearch:
      enabled: false

application:
  domain-settings:
    asset-mgmnt:
      storage-providers:
        minio:
          url: ${MINIO_URL:http://tenant-minio.drr-tnt-swfabrik-europe-dev.svc.cluster.local:9000}
          access-key: ${MINIO_ACCESS_KEY:admin@dexterity.org.de}
          secret-key: ${MINIO_SECRET_KEY:admin_1a88a1}

springdoc:
  oauth2:
    authorization-url: ${SWAGGER_OAUTH_AUTH_URL:http://keycloak.darueira-tnt-swfabrik-europe.127.0.0.1.nip.io/realms/dexterity-apps-01/protocol/openid-connect/auth}
