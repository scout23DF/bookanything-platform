logging:
    level:
        de:
            org:
                dexterity:
                    bookanything: INFO

server:
    port: 8060

spring:
    application:
        name: BookAnythingBackendApplication
    main:
        allow-bean-definition-overriding: true
    servlet:
        multipart:
            max-file-size: 50MB
            max-request-size: 50MB
    datasource:
        driver-class-name: org.postgresql.Driver
        hikari:
            auto-commit: false
            poolName: Hikari
        type: com.zaxxer.hikari.HikariDataSource
        url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/DBBookAnythingPlatform}
        username: ${SPRING_DATASOURCE_USERNAME:dbabookanythingapps01}
        password: ${SPRING_DATASOURCE_PASSWORD:1a88a1}
    devtools:
        livereload:
            enabled: true
        restart:
            enabled: true
    data:
        jpa:
            repositories:
                bootstrap-mode: deferred
    jpa:
        hibernate:
            # ddl-auto: none
            ddl-auto: update
            naming:
                implicit-strategy: org.springframework.boot.hibernate.SpringImplicitNamingStrategy
                physical-strategy: org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy
        open-in-view: true
        properties:
            hibernate:
                bytecode:
                    provider: bytebuddy
                connection:
                    provider_disables_autocommit: true
                generate_statistics: false
                jdbc:
                    batch_size: 25
                    time_zone: UTC
                order_inserts: true
                order_updates: true
                query:
                    fail_on_pagination_over_collection_fetch: true
                    in_clause_parameter_padding: true
                show_sql: true
                format_sql: true
                dialect: org.hibernate.dialect.PostgreSQLDialect
        database-platform: org.hibernate.dialect.PostgreSQLDialect
    liquibase:
        change-log: classpath:config/liquibase/master.xml
    jackson:
        default-property-inclusion: non_absent

    security:
        oauth2:
            resourceserver:
                jwt:
                    jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://localhost:9080/realms/dexterity-apps-01/protocol/openid-connect/certs}
            resource-server:
                jwt:
                    jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://localhost:9080/realms/dexterity-apps-01/protocol/openid-connect/certs}
            client:
                provider:
                    oidc:
                        issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:9080/realms/dexterity-apps-01}
    
                registration:
                    oidc:
                        client-id: ${KEYCLOAK_CLIENT_ID:web_app}
                        client-secret: ${KEYCLOAK_CLIENT_SECRET:web_app}
                        scope: openid,profile,email

    kafka:
        bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
        producer:
            key-serializer: org.apache.kafka.common.serialization.StringSerializer
            value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
            properties:
                spring.json.add.type.headers: true
                max.request.size: 52428800
        consumer:
            group-id: elasticsearch-indexer
            key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
            value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
            properties:
                spring:
                    deserializer:
                        value:
                            delegate:
                                class: org.springframework.kafka.support.serializer.JsonDeserializer
                    json:
                        trusted:
                            packages: de.grundid.opendatalab.geojson,de.org.dexterity.bookanything.*
                max.partition.fetch.bytes: 52428800
                request.timeout.ms: 300000
                heartbeat.interval.ms: 1000
                max.poll.interval.ms: 9000000
                max.poll.records: 100
                session.timeout.ms: ${KAFKA_CONSUMER_SESSION_TIMEOUT_MS:45000}

    elasticsearch:
        uris: ${SPRING_ELASTICSEARCH_URIS:http://localhost:9200}

    docker:
        compose:
            enabled: ${SPRING_DOCKER_COMPOSE_ENABLED:true}
            readiness:
                tcp:
                    connect-timeout: 60000ms
                    read-timeout: 60000ms
                wait: never
                timeout: 15s
            # lifecycle-management: start-and-stop
            lifecycle-management: start_only
            start:
                log-level: debug

    ai:
        model:
            chat: google-genai
        google:
            genai:
                api-key: ${GEMINI_API_KEY:}
                chat:
                    model: gemini-2.5-flash-lite
                    temperature: 0.2
                    top-p: 0.8
                    options:
                        model: gemini-2.5-flash-lite
                        temperature: 0.2
                        top-p: 0.8

management:
    health:
        elasticsearch:
            enabled: false
    endpoint:
        health:
            probes:
                enabled: true
            show-details: always
    endpoints:
        web:
            base-path: /management
            exposure:
                include:
                    - configprops
                    - env
                    - health
                    - info
                    - logfile
                    - loggers
                    - threaddump

application:
    security:
        oauth2:
            audience: account,api://default

    domain-settings:
        geolocation:
            update-boundary-via-ia:
                feature-enabled: false
        asset-mgmnt:
            storage-providers:
                minio:
                    url: ${MINIO_URL:http://localhost:9900}
                    access-key: ${MINIO_ACCESS_KEY:admin@dexterity.org.de}
                    secret-key: ${MINIO_SECRET_KEY:admin_1a88a1}

springdoc:
    enable-native-support: true
    swagger-ui:
        operationsSorter: alpha
        tagsSorter: alpha
        tryItOutEnabled: true
        oauth:
            client-id: ${SWAGGER_OAUTH_CLIENT_ID:swaggerui-test-app}
            realm: ${KEYCLOAK_REALM:dexterity-apps-01}
    oauth2:
        authorization-url: ${SWAGGER_OAUTH_AUTH_URL:http://localhost:9080/realms/dexterity-apps-01/protocol/openid-connect/auth}

gadm:
    api:
        base-url: https://geodata.ucdavis.edu/gadm/gadm4.1/json
        file-template: gadm41_[COUNTRY_ALIAS]_[LEVEL_NUMBER].json

topics:
    geolocation:
        geojson-download:
            requested: "geolocation.geojson-download.requested"
            hierarchical-geo-json-data-required: "geolocation.geojson-download.hierarchical-geo-json-data-required"
            failed: "geolocation.geojson-download.failed"
        geojson-file:
            downloaded: "geolocation.geojson-file.downloaded"
        geojson-imported-file:
            ready-to-make-geo-locations: "geolocation.geojson-imported-file.ready-to-make-geo-locations"
        batch-import:
            completed: "geolocation.batch-import.completed"
        nifi-import:
            requested: "geolocation.nifi-import.requested"
            completed: "geolocation.nifi-import.completed"
    asset-manager:
        asset-creation:
            registered: "asset-manager.asset-creation.registered.topic"
            uploaded-to-storage: "asset-manager.asset-creation.uploaded-to-storage.topic"

temporal:
    service-address: "${TEMPORAL_SERVICE_ADDRESS:10.152.183.189:7233}"
    namespace: "${TEMPORAL_NAMESPACE:corporate-core}"
    task-queue: "${TEMPORAL_TASK_QUEUE:GEOLOCATION_INGESTION_TASK_QUEUE}"

nifi:
    base-url: "${NIFI_BASE_URL:https://nifi.darueira-corpshared.127.0.0.1.nip.io}"
    import-timeout-minutes: "${NIFI_IMPORT_TIMEOUT_MINUTES:25}"

jsreport:
    base-url: "${JSREPORT_BASE_URL:http://10.152.183.35:5488}"
    username: "${JSREPORT_USERNAME:admin}"
    password: "${JSREPORT_PASSWORD:change-me-in-openbao}"
    template-name: "${JSREPORT_TEMPLATE_NAME:geolocation-batch-summary}"

corporate:
    minio:
        endpoint: "${CORPORATE_MINIO_ENDPOINT:http://central-minio.drr-corpshared-plat.svc.cluster.local:9000}"
        access-key: "${CORPORATE_MINIO_ACCESS_KEY:minioadmin}"
        secret-key: "${CORPORATE_MINIO_SECRET_KEY:Darueira@2026!}"
        reports-bucket: "${CORPORATE_MINIO_REPORTS_BUCKET:darueira-reports}"

